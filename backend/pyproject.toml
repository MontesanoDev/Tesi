[project]
name = "mapi-rag-api"
version = "0.1.0"
description = "API FastAPI e persistenza SQLite per il prototipo Mapi RAG"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1,<2",
    "langchain-ollama>=1,<2",
    "langchain-qdrant>=1,<2",
    "ollama>=0.6.3,<1",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.15,<2",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
